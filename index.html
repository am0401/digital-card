<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aksharmurti Swami</title>
  <meta name="description" content="North America AVL Lead · BAPS Swaminarayan Sanstha">
  <meta property="og:title" content="Aksharmurti Swami">
  <meta property="og:description" content="North America AVL Lead · BAPS Swaminarayan Sanstha">
  <meta property="og:type" content="profile">
  <style>
    :root {
      --bg: #fafaf7;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #b8521f;
      --border: #e8e6e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1816;
        --card: #24211e;
        --text: #f0ede8;
        --muted: #a09c94;
        --accent: #e08456;
        --border: #3a3632;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 32px 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .photo {
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      display: block;
      border: 3px solid var(--border);
    }
    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .title { color: var(--accent); text-align: center; font-size: 15px; margin: 0 0 4px; font-weight: 500; }
    .company { color: var(--muted); text-align: center; font-size: 14px; margin: 0 0 4px; }
    .tagline { color: var(--muted); text-align: center; font-size: 13px; margin: 8px 0 24px; font-style: italic; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--bg); border-color: var(--accent); }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      justify-content: center;
    }
    .btn.primary:hover { opacity: 0.92; background: var(--accent); }
    .btn-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.7; }
    .btn.primary .btn-icon { opacity: 1; }
    .footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="photo" style="display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:300;color:var(--muted);background:var(--bg);">A</div>
    <h1>Aksharmurti Swami</h1>
    <p class="title">North America AVL Lead</p>
    <p class="company">BAPS Swaminarayan Sanstha</p>
    
    <div class="actions">
      <a href="card.vcf" class="btn primary" download>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Save to Contacts
      </a>
      <a href="mailto:am0401@na.baps.org" class="btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        am0401@na.baps.org
      </a>
      <a href="https://www.baps.org/" class="btn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        www.baps.org
      </a>
    </div>
    <div class="footer">Scan the QR code on my card to open this page</div>
  </main>
</body>
</html>
